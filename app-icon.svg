<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1f293d" stroke-width="6"/>

  <!-- Subtle grid dots -->
  <g fill="#334155" opacity="0.4">
    <circle cx="128" cy="128" r="4"/><circle cx="192" cy="128" r="4"/><circle cx="256" cy="128" r="4"/><circle cx="320" cy="128" r="4"/><circle cx="384" cy="128" r="4"/>
    <circle cx="128" cy="192" r="4"/><circle cx="384" cy="192" r="4"/>
    <circle cx="128" cy="320" r="4"/><circle cx="384" cy="320" r="4"/>
    <circle cx="128" cy="384" r="4"/><circle cx="192" cy="384" r="4"/><circle cx="256" cy="384" r="4"/><circle cx="320" cy="384" r="4"/><circle cx="384" cy="384" r="4"/>
  </g>

  <!-- Glowing Stethoscope / Medical Cross + AI Node Core -->
  <g filter="url(#glow)">
    <!-- Shield / Doctor Cross Backing -->
    <path d="M216 110 h80 v96 h96 v80 h-96 v96 h-80 v-96 h-96 v-80 h96 Z" 
          fill="url(#primaryGrad)" 
          rx="18"
          opacity="0.95"/>
  </g>

  <!-- Inner ECG / Network Pulse Wave -->
  <path d="M140 250 L195 250 L220 200 L245 300 L275 170 L300 280 L320 250 L372 250" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- AI Nodes -->
  <circle cx="220" cy="200" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="4"/>
  <circle cx="275" cy="170" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
  <circle cx="245" cy="300" r="8" fill="#06b6d4" stroke="#ffffff" stroke-width="4"/>
</svg>
