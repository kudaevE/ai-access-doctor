<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, Monaco, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bg)" />

  <!-- App Window Container -->
  <rect x="20" y="20" width="1160" height="740" rx="16" fill="#030712" stroke="#1f2937" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Window Header Bar -->
  <rect x="20" y="20" width="1160" height="48" rx="16" fill="#0f172a" />
  <rect x="20" y="52" width="1160" height="16" fill="#0f172a" />
  <line x1="20" y1="68" x2="1180" y2="68" stroke="#1f2937" stroke-width="1" />
  <circle cx="44" cy="44" r="6" fill="#ef4444" />
  <circle cx="64" cy="44" r="6" fill="#f59e0b" />
  <circle cx="84" cy="44" r="6" fill="#10b981" />
  <text x="580" y="49" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle" class="font-sans">
    AI Access Doctor — Antigravity &amp; Google AI Doctor (РФ / СНГ)
  </text>

  <!-- SIDEBAR (Left 240px) -->
  <rect x="20" y="68" width="240" height="692" fill="#0b0f19" />
  <line x1="260" y1="68" x2="260" y2="760" stroke="#1f2937" stroke-width="1" />
  <text x="40" y="112" fill="#ffffff" font-size="14" font-weight="bold" class="font-sans">AI Access Doctor</text>
  <text x="40" y="126" fill="#38bdf8" font-size="10" font-weight="600" class="font-sans">v1.0.0 • Windows x64</text>

  <text x="68" y="170" fill="#94a3b8" font-size="12" class="font-sans">Дашборд</text>

  <!-- Active Tab: Antigravity Doctor -->
  <rect x="32" y="186" width="216" height="38" rx="10" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.3" />
  <circle cx="52" cy="205" r="4" fill="#38bdf8" />
  <text x="68" y="210" fill="#38bdf8" font-size="12" font-weight="600" class="font-sans">Antigravity Doctor</text>

  <text x="68" y="250" fill="#94a3b8" font-size="12" class="font-sans">Google Flow Studio</text>
  <text x="68" y="290" fill="#94a3b8" font-size="12" class="font-sans">Спидтест ИИ</text>
  <text x="68" y="330" fill="#94a3b8" font-size="12" class="font-sans">Сеть и Прокси</text>
  <text x="68" y="370" fill="#94a3b8" font-size="12" class="font-sans">Детектив ошибок</text>

  <!-- MAIN VIEWPORT -->
  <!-- Header -->
  <rect x="280" y="84" width="880" height="60" rx="12" fill="url(#cardBg)" stroke="#1f2937" stroke-width="1" />
  <circle cx="310" cy="114" r="16" fill="#0284c7" fill-opacity="0.2" />
  <text x="310" y="120" fill="#38bdf8" font-size="16" text-anchor="middle">⚡</text>
  <text x="338" y="110" fill="#ffffff" font-size="16" font-weight="bold" class="font-sans">Antigravity &amp; Google AI Doctor</text>
  <rect x="585" y="98" width="90" height="18" rx="5" fill="#0284c7" fill-opacity="0.2" />
  <text x="630" y="111" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" class="font-sans">Обход РФ / СНГ</text>
  <text x="338" y="128" fill="#94a3b8" font-size="11" class="font-sans">Автоматическое устранение блокировок DNS, ошибок region-400 и зависаний IPv6</text>

  <!-- Optimal Status Banner -->
  <rect x="280" y="156" width="880" height="110" rx="14" fill="url(#greenGlow)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5" />
  <rect x="302" y="174" width="48" height="48" rx="12" fill="#10b981" fill-opacity="0.2" />
  <text x="326" y="204" fill="#34d399" font-size="24" text-anchor="middle">🛡️</text>

  <rect x="362" y="174" width="165" height="20" rx="5" fill="#10b981" fill-opacity="0.25" />
  <text x="444" y="188" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle" class="font-sans">АКТИВЕН И ЗАЩИЩЁН</text>
  
  <text x="362" y="214" fill="#ffffff" font-size="13" font-weight="bold" class="font-sans">
    Режим обхода активен. Запросы к Google Antigravity и CloudCode маршрутизируются через чистый NRPT.
  </text>
  <text x="362" y="238" fill="#a7f3d0" font-size="11" class="font-sans">
    ● NRPT DNS: <tspan font-weight="bold">Активен</tspan> &nbsp;•&nbsp; 
    Шлюз ag_dns: <tspan font-weight="bold">Работает</tspan> &nbsp;•&nbsp; 
    IPv4 Приоритет: <tspan font-weight="bold">Включен (::ffff:0:0/96)</tspan> &nbsp;•&nbsp; 
    cloudcode-pa: <tspan font-weight="bold">200 OK (48мс)</tspan>
  </text>

  <!-- 3 PROFILES CHOOSER -->
  <!-- Profile 1: Recommended -->
  <rect x="280" y="280" width="280" height="110" rx="12" fill="#0c4a6e" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="304" cy="304" r="8" fill="#38bdf8" />
  <text x="320" y="309" fill="#ffffff" font-size="12" font-weight="bold" class="font-sans">1. ag_relay (Рекомендуется)</text>
  <rect x="495" y="296" width="55" height="16" rx="4" fill="#38bdf8" fill-opacity="0.3" />
  <text x="522" y="308" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle" class="font-sans">PRO</text>
  <text x="296" y="334" fill="#cbd5e1" font-size="10" class="font-sans">Полный комплекс: чистый NRPT DNS +</text>
  <text x="296" y="350" fill="#cbd5e1" font-size="10" class="font-sans">локальный loopback relay против region-400.</text>
  <text x="296" y="374" fill="#38bdf8" font-size="10" font-weight="bold" class="font-sans">✓ Активировано в системе</text>

  <!-- Profile 2: Direct NRPT -->
  <rect x="575" y="280" width="280" height="110" rx="12" fill="url(#cardBg)" stroke="#1f2937" stroke-width="1" />
  <text x="595" y="309" fill="#94a3b8" font-size="12" font-weight="bold" class="font-sans">2. Чистый NRPT (Без релея)</text>
  <text x="595" y="334" fill="#94a3b8" font-size="10" class="font-sans">Прямое перенаправление доменов Google</text>
  <text x="595" y="350" fill="#94a3b8" font-size="10" class="font-sans">на 1.1.1.1 / 8.8.8.8. Без фоновых процессов.</text>
  <text x="595" y="374" fill="#64748b" font-size="10" class="font-sans">Выбрать профиль →</text>

  <!-- Profile 3: Rollback -->
  <rect x="870" y="280" width="290" height="110" rx="12" fill="url(#cardBg)" stroke="#1f2937" stroke-width="1" />
  <text x="890" y="309" fill="#f87171" font-size="12" font-weight="bold" class="font-sans">3. Полный откат настроек</text>
  <text x="890" y="334" fill="#94a3b8" font-size="10" class="font-sans">Мгновенное удаление всех правил NRPT,</text>
  <text x="890" y="350" fill="#94a3b8" font-size="10" class="font-sans">остановка релея и сброс DNS к заводским.</text>
  <rect x="890" y="362" width="130" height="22" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
  <text x="955" y="377" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle" class="font-sans">Откатить настройки</text>

  <!-- ENDPOINTS LIVE AUDIT TABLE -->
  <rect x="280" y="404" width="880" height="190" rx="12" fill="url(#cardBg)" stroke="#1f2937" stroke-width="1" />
  <text x="300" y="428" fill="#ffffff" font-size="13" font-weight="bold" class="font-sans">
    Состояние эндпоинтов Google Antigravity &amp; AI
  </text>
  
  <line x1="280" y1="442" x2="1160" y2="442" stroke="#1f2937" stroke-width="1" />
  <text x="300" y="460" fill="#64748b" font-size="10" font-weight="bold" class="font-sans">СЕРВИС</text>
  <text x="550" y="460" fill="#64748b" font-size="10" font-weight="bold" class="font-sans">ЭНДПОИНТ</text>
  <text x="830" y="460" fill="#64748b" font-size="10" font-weight="bold" class="font-sans">СТАТУС</text>
  <text x="960" y="460" fill="#64748b" font-size="10" font-weight="bold" class="font-sans">DNS</text>
  <text x="1060" y="460" fill="#64748b" font-size="10" font-weight="bold" class="font-sans">RTT ПИНГ</text>

  <!-- Row 1 -->
  <line x1="280" y1="472" x2="1160" y2="472" stroke="#1f2937" stroke-width="1" />
  <text x="300" y="492" fill="#ffffff" font-size="11" font-weight="600" class="font-sans">Google CloudCode PA</text>
  <text x="550" y="492" fill="#38bdf8" font-size="11" class="font-mono">cloudcode-pa.googleapis.com</text>
  <text x="830" y="492" fill="#34d399" font-size="11" font-weight="bold" class="font-sans">200 OK (Clean)</text>
  <text x="960" y="492" fill="#34d399" font-size="11" class="font-sans">NRPT</text>
  <text x="1060" y="492" fill="#34d399" font-size="11" font-weight="bold" class="font-sans">48 мс</text>

  <!-- Row 2 -->
  <line x1="280" y1="508" x2="1160" y2="508" stroke="#1f2937" stroke-width="1" />
  <text x="300" y="528" fill="#ffffff" font-size="11" font-weight="600" class="font-sans">Google Accounts Auth</text>
  <text x="550" y="528" fill="#38bdf8" font-size="11" class="font-mono">accounts.google.com</text>
  <text x="830" y="528" fill="#34d399" font-size="11" font-weight="bold" class="font-sans">200 OK</text>
  <text x="960" y="528" fill="#34d399" font-size="11" class="font-sans">NRPT</text>
  <text x="1060" y="528" fill="#34d399" font-size="11" font-weight="bold" class="font-sans">42 мс</text>

  <!-- Row 3 -->
  <line x1="280" y1="544" x2="1160" y2="544" stroke="#1f2937" stroke-width="1" />
  <text x="300" y="564" fill="#ffffff" font-size="11" font-weight="600" class="font-sans">Google Gemini API</text>
  <text x="550" y="564" fill="#38bdf8" font-size="11" class="font-mono">generativelanguage.googleapis.com</text>
  <text x="830" y="564" fill="#34d399" font-size="11" font-weight="bold" class="font-sans">200 OK</text>
  <text x="960" y="564" fill="#34d399" font-size="11" class="font-sans">NRPT</text>
  <text x="1060" y="564" fill="#34d399" font-size="11" font-weight="bold" class="font-sans">55 мс</text>

  <!-- FOOTER: HOSTS DOCTOR INTEGRATION -->
  <rect x="280" y="606" width="880" height="74" rx="10" fill="#064e3b" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="305" cy="643" r="14" fill="#10b981" fill-opacity="0.2" />
  <text x="305" y="648" fill="#34d399" font-size="14" text-anchor="middle">🩺</text>
  <text x="330" y="638" fill="#ffffff" font-size="12" font-weight="bold" class="font-sans">Hosts File Doctor: Системный файл hosts чист</text>
  <text x="330" y="656" fill="#94a3b8" font-size="10" class="font-sans">
    Нет конфликтующих записей для *.googleapis.com. Резервная копия hosts.bak создана автоматически.
  </text>
  <rect x="1020" y="628" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="1082" y="646" fill="#cbd5e1" font-size="10" font-weight="bold" text-anchor="middle" class="font-sans">Открыть папку etc</text>
</svg>
