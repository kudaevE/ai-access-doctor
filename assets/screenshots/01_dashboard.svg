  <!-- Active Tab: Dashboard -->
  <rect x="32" y="146" width="216" height="38" rx="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3" />
  <circle cx="52" cy="165" r="4" fill="#38bdf8" />
  <text x="68" y="170" fill="#38bdf8" font-size="12" font-weight="600" class="font-sans">Дашборд</text>

