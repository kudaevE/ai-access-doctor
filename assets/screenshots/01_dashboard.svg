  <text x="352" y="322" fill="#cbd5e1" font-size="11" class="font-sans">
    Обнаружено: в реестре Windows (WinINet) активен порт 127.0.0.1:10809 (работает штатно), но в переменных
  </text>
  <text x="352" y="338" fill="#cbd5e1" font-size="11" class="font-sans">
    окружения HTTP_PROXY указан 127.0.0.1:53200, который возвращает ошибку 502 Bad Gateway.
  </text>
  <text x="352" y="358" fill="#fda4af" font-size="11" font-weight="bold" class="font-sans">
