  <!-- VERDICT BANNER (CRITICAL / PROXY CONFLICT) -->
  <rect x="280" y="258" width="860" height="160" rx="14" fill="url(#roseGlow)" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1.5" />
  <rect x="300" y="278" width="40" height="40" rx="10" fill="#e11d48" fill-opacity="0.2" />
  <text x="320" y="303" fill="#fb7185" font-size="20" text-anchor="middle">⚠️</text>
