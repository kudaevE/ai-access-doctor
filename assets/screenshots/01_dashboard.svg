  <text x="300" y="548" fill="#94a3b8" font-size="11" class="font-sans">● IPv6-blackhole: приоритет IPv4 включен</text>

  <!-- Tile 2 -->
  <rect x="570" y="434" width="275" height="140" rx="12" fill="url(#cardBg)" stroke="#1f2937" stroke-width="1" />
  <text x="590" y="460" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans">DNS И БЛОКИРОВКИ</text>
  <text x="590" y="488" fill="#ffffff" font-size="16" font-weight="bold" class="font-sans">DoH / NRPT Чистый</text>
  <text x="590" y="512" fill="#34d399" font-size="11" class="font-sans">● Cloudflare 1.1.1.1: 14мс (Чистый)</text>
  <text x="590" y="530" fill="#34d399" font-size="11" class="font-sans">● Google DNS 8.8.8.8: 18мс (Чистый)</text>
  <text x="590" y="548" fill="#38bdf8" font-size="11" class="font-sans">● Защита NRPT: активна для *.googleapis.com</text>

  <!-- Tile 3 -->
  <rect x="860" y="434" width="280" height="140" rx="12" fill="url(#cardBg)" stroke="#1f2937" stroke-width="1" />
  <text x="880" y="460" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans">ДОСТУПНОСТЬ ИИ-СЕРВИСОВ</text>
  <text x="880" y="488" fill="#ffffff" font-size="16" font-weight="bold" class="font-sans">5 / 5 Протестировано</text>
  <text x="880" y="512" fill="#34d399" font-size="11" class="font-sans">● Google Antigravity &amp; PA: 48мс</text>
  <text x="880" y="530" fill="#34d399" font-size="11" class="font-sans">● Google Gemini API: 55мс</text>
  <text x="880" y="548" fill="#38bdf8" font-size="11" class="font-sans">● OpenAI / Claude / GitHub: Доступны</text>

  <!-- SYSTEM TRAY HINT FOOTER -->
  <rect x="280" y="590" width="860" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="300" y="616" fill="#94a3b8" font-size="11" class="font-sans">
    💡 <tspan fill="#ffffff" font-weight="bold">Системный трей Windows активен:</tspan> сворачивайте программу в фон и очищайте кэш DNS кликом правой кнопки мыши по значку в трее.
