  <text x="86" y="104" fill="#ffffff" font-size="14" font-weight="bold" class="font-sans">AI Access Doctor</text>
  <text x="86" y="118" fill="#38bdf8" font-size="10" font-weight="600" class="font-sans">v1.0.0 • Windows x64</text>

