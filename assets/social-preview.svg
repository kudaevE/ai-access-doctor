<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="120" r="180" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1100" cy="500" r="220" fill="#7c3aed" opacity="0.18" filter="url(#glow)"/>
  <circle cx="950" cy="180" r="160" fill="#059669" opacity="0.12" filter="url(#glow)"/>

  <!-- Decorative Grid Overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 100)">
    <!-- Pill: Windows 10/11 & Local First -->
    <g transform="translate(0, 0)">
      <rect width="280" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#10b981"/>
      <text x="32" y="22" fill="#94a3b8" font-size="13" font-weight="600" class="font-sans">WINDOWS 10 / 11 &#160;•&#160; 100% LOCAL-FIRST</text>
    </g>

    <!-- App Title with Gradient -->
    <text x="0" y="95" fill="#f8fafc" font-size="52" font-weight="900" letter-spacing="-1" class="font-sans">AI Access Doctor</text>
    
    <!-- Subtitle -->
    <text x="0" y="140" fill="#38bdf8" font-size="20" font-weight="600" class="font-sans">
      Windows Diagnostic, Network Unlock &amp; Bypass Suite
    </text>

    <text x="0" y="172" fill="#94a3b8" font-size="15" class="font-sans">
      Автоматическое решение сбоев подключения к Google Antigravity, Veo, Gemini,
    </text>
    <text x="0" y="196" fill="#94a3b8" font-size="15" class="font-sans">
      OpenAI и Claude: обход region-400, синхронизация прокси и аудит hosts.
    </text>

    <!-- Feature Pills Grid -->
    <g transform="translate(0, 230)">
      <!-- Pill 1: Antigravity -->
      <g transform="translate(0, 0)">
        <rect width="250" height="42" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
        <text x="18" y="26" fill="#38bdf8" font-size="14" font-weight="700" class="font-sans">⚡ Antigravity &amp; NRPT</text>
      </g>

      <!-- Pill 2: Google Flow Veo -->
      <g transform="translate(265, 0)">
        <rect width="250" height="42" rx="10" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="18" y="26" fill="#c084fc" font-size="14" font-weight="700" class="font-sans">🎬 Google Flow (Veo)</text>
      </g>

      <!-- Pill 3: Speed Benchmark -->
      <g transform="translate(0, 54)">
        <rect width="250" height="42" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="18" y="26" fill="#fbbf24" font-size="14" font-weight="700" class="font-sans">⏱️ Спидтест ИИ (RTT Matrix)</text>
      </g>

      <!-- Pill 4: Hosts & CLI -->
      <g transform="translate(265, 54)">
        <rect width="250" height="42" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
        <text x="18" y="26" fill="#34d399" font-size="14" font-weight="700" class="font-sans">🩺 Hosts &amp; CLI Proxy Sync</text>
      </g>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 360)">
      <text x="0" y="22" fill="#64748b" font-size="13" font-weight="600" class="font-mono">TECH STACK:</text>
      
      <!-- Rust -->
      <rect x="95" y="5" width="85" height="26" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="137" y="22" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle" class="font-sans">🦀 Rust</text>

      <!-- Tauri v2 -->
      <rect x="190" y="5" width="95" height="26" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="237" y="22" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle" class="font-sans">⚡ Tauri v2</text>

      <!-- React TS -->
      <rect x="295" y="5" width="130" height="26" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="360" y="22" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle" class="font-sans">⚛️ React 18 + TS</text>

      <!-- MIT License -->
      <rect x="435" y="5" width="80" height="26" rx="6" fill="#0f172a" stroke="#10b981"/>
      <text x="475" y="22" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle" class="font-sans">MIT</text>
    </g>
  </g>

  <!-- Right Side: Mini UI Window Preview Card -->
  <g transform="translate(680, 90)">
    <!-- Shadow Card -->
    <rect x="0" y="0" width="520" height="460" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Window Titlebar -->
    <rect x="0" y="0" width="520" height="42" rx="16" fill="#0d1424"/>
    <rect x="0" y="26" width="520" height="16" fill="#0d1424"/>
    <line x1="0" y1="42" x2="520" y2="42" stroke="#1e293b"/>

    <!-- Mac-style dots -->
    <circle cx="22" cy="21" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="21" r="5.5" fill="#f59e0b"/>
    <circle cx="54" cy="21" r="5.5" fill="#10b981"/>
    <text x="260" y="26" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" class="font-sans">AI Access Doctor v1.0.0 — Diagnostic Suite</text>

    <!-- Mini Dashboard Content -->
    <!-- Alert Box -->
    <rect x="20" y="60" width="480" height="74" rx="10" fill="#450a0a" fill-opacity="0.35" stroke="#ef4444" stroke-opacity="0.6"/>
    <circle cx="48" cy="97" r="14" fill="#ef4444" fill-opacity="0.2"/>
    <text x="48" y="103" fill="#ef4444" font-size="14" text-anchor="middle">⚠️</text>
    <text x="74" y="86" fill="#fca5a5" font-size="13" font-weight="700" class="font-sans">Конфликт прокси Windows и CLI</text>
    <text x="74" y="106" fill="#cbd5e1" font-size="11" class="font-sans">В реестре WinINet активен порт 10809, в CLI — 53200 (502 Bad Gateway)</text>
    <rect x="375" y="80" width="115" height="28" rx="6" fill="#e11d48"/>
    <text x="432" y="98" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" class="font-sans">Safe Fix (1 клик)</text>

    <!-- Status Cards Grid (3 columns) -->
    <!-- Col 1: Antigravity -->
    <rect x="20" y="150" width="150" height="120" rx="10" fill="#0c4a6e" fill-opacity="0.25" stroke="#0284c7" stroke-width="1.2"/>
    <text x="35" y="175" fill="#38bdf8" font-size="12" font-weight="bold" class="font-sans">Antigravity РФ</text>
    <text x="35" y="196" fill="#34d399" font-size="11" font-weight="600" class="font-sans">● NRPT Активен</text>
    <text x="35" y="214" fill="#94a3b8" font-size="10" class="font-sans">IPv4 приоритет OK</text>
    <text x="35" y="232" fill="#94a3b8" font-size="10" class="font-sans">RTT: 48 мс</text>
    <text x="35" y="254" fill="#38bdf8" font-size="10" font-weight="bold" class="font-sans">✓ Без region-400</text>

    <!-- Col 2: Speed Benchmark -->
    <rect x="185" y="150" width="150" height="120" rx="10" fill="#14532d" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2"/>
    <text x="200" y="175" fill="#34d399" font-size="12" font-weight="bold" class="font-sans">Спидтест ИИ</text>
    <text x="200" y="196" fill="#fbbf24" font-size="11" font-weight="600" class="font-sans">🏆 Groq: 28 мс</text>
    <text x="200" y="214" fill="#94a3b8" font-size="10" class="font-sans">Gemini: 45 мс</text>
    <text x="200" y="232" fill="#94a3b8" font-size="10" class="font-sans">OpenAI: 78 мс</text>
    <text x="200" y="254" fill="#10b981" font-size="10" font-weight="bold" class="font-sans">9 / 9 онлайн</text>

    <!-- Col 3: Hosts Doctor -->
    <rect x="350" y="150" width="150" height="120" rx="10" fill="#1e1b4b" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <text x="365" y="175" fill="#a5b4fc" font-size="12" font-weight="bold" class="font-sans">Hosts Doctor</text>
    <text x="365" y="196" fill="#34d399" font-size="11" font-weight="600" class="font-sans">● hosts чист</text>
    <text x="365" y="214" fill="#94a3b8" font-size="10" class="font-sans">Записей ИИ: 0</text>
    <text x="365" y="232" fill="#94a3b8" font-size="10" class="font-sans">hosts.bak создан</text>
    <text x="365" y="254" fill="#818cf8" font-size="10" font-weight="bold" class="font-sans">Безопасно</text>

    <!-- Live Diagnostics Log Console -->
    <rect x="20" y="286" width="480" height="154" rx="8" fill="#030712" stroke="#1f2937"/>
    <text x="35" y="310" fill="#64748b" font-size="10" font-weight="bold" class="font-mono">DIAGNOSTIC LOG ENGINE (LOCAL-FIRST)</text>
    <text x="35" y="332" fill="#34d399" font-size="11" class="font-mono">[✓] WinINet User Proxy: 127.0.0.1:10809 (HTTP OK)</text>
    <text x="35" y="352" fill="#38bdf8" font-size="11" class="font-mono">[✓] NRPT Policy Rule: *.googleapis.com -&gt; Clean DNS</text>
    <text x="35" y="372" fill="#fbbf24" font-size="11" class="font-mono">[!] CLI Git proxy was out of sync -&gt; Synced with WinINet</text>
    <text x="35" y="392" fill="#34d399" font-size="11" class="font-mono">[✓] cloudcode-pa.googleapis.com RTT: 48ms (HTTP 200)</text>
    <text x="35" y="412" fill="#a78bfa" font-size="11" class="font-mono">[✓] All systems operational. Ready for pair programming.</text>
  </g>
</svg>
