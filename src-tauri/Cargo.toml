[package]
name = "ai-access-doctor"
version = "1.0.0"
description = "Production-oriented Windows desktop application diagnosing AI developer tool connectivity, authentication, and routing failures."
edition = "2021"

[lib]
name = "ai_access_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
x509-parser = "0.17"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
socket2 = "0.5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_SystemServices",
] }
